name: validate

# 결정적 검증 게이트(scripts/validate.mjs)를 push/PR마다 자동 실행.
# 로컬 커밋 전 게이트와 동일: JS 문법, 갤러리 두 리스트 동기화, 자산 존재,
# 캐시버전 형식, git diff --check. 빌드 도구/의존성 없음 → node만 필요.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run validate.mjs
        run: node scripts/validate.mjs
