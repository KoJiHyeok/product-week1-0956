<html lang="ko">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="사진에 어울리는 제목을 만들고 랭킹과 댓글로 함께 즐기는 제목 학원입니다." />
  <title>제목 학원</title>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2571483149742375" crossorigin="anonymous"></script>
  <link href="style.css" rel="stylesheet" />
</head>
<body>
  <div class="page-dim" id="pageDim" hidden></div>

  <main class="app-shell" id="appShell">
    <header class="top-bar">
      <a class="brand" id="homeLink" href="#" aria-label="제목 학원 홈">제목 학원</a>

      <div class="auth-actions" id="authActions">
        <button class="auth-link-button" id="loginButton" type="button">로그인</button>
        <button class="auth-button solid small" id="signupButton" type="button">회원가입</button>
      </div>

      <button class="user-chip" id="userChip" type="button" hidden aria-label="회원 정보 열기">
        <span class="user-name" id="userName"></span>
        <span class="profile-photo" id="profilePhoto" aria-hidden="true"></span>
      </button>
    </header>

    <section class="view gallery-view" id="homeView" aria-label="사진 선택">
      <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <section class="view play-view" id="titleView" hidden aria-label="제목 입력">
      <div class="selected-photo-frame">
        <img class="selected-photo" id="selectedPhoto" alt="" />
      </div>

      <form class="entry-form" id="titleForm">
        <label for="titleInput">제목</label>
        <div class="entry-row">
          <input id="titleInput" type="text" maxlength="60" autocomplete="off" placeholder="이 사진의 제목을 입력하세요" />
          <button class="auth-button solid" type="submit">완료</button>
        </div>
      </form>
    </section>

    <section class="view guest-view" id="guestView" hidden aria-label="비회원 이름 입력">
      <form class="entry-form compact-form" id="guestForm">
        <label for="guestNameInput">이름</label>
        <p class="form-copy">비회원으로 등록할 이름을 입력하세요.</p>
        <div class="entry-row">
          <input id="guestNameInput" type="text" maxlength="24" autocomplete="nickname" placeholder="이름을 입력하세요" />
          <button class="auth-button solid" type="submit">랭킹 보기</button>
        </div>
      </form>
    </section>

    <section class="view ranking-view" id="rankingView" hidden aria-label="랭킹">
      <div class="ranking-head">
        <div>
          <p class="view-kicker">랭킹</p>
          <h1>이 사진의 제목들</h1>
        </div>
        <button class="auth-button ghost" id="backToGalleryButton" type="button">다른 사진 선택</button>
      </div>

      <div class="ranking-layout">
        <div class="ranking-photo-frame">
          <img class="ranking-photo" id="rankingPhoto" alt="" />
        </div>
        <ol class="ranking-list" id="rankingList"></ol>
      </div>
    </section>
  </main>

  <aside class="profile-drawer" id="profileDrawer" aria-hidden="true" aria-label="회원 정보">
    <button class="drawer-edge-close" id="drawerEdgeClose" type="button" aria-label="닫기">&gt;</button>
    <div class="drawer-head">
      <h2>회원 정보</h2>
    </div>

    <div class="drawer-view is-active" id="drawerMenuView">
      <div class="drawer-profile">
      <button class="avatar-edit-button" id="avatarEditButton" type="button" aria-label="프로필 이미지 수정">
        <span class="profile-photo large" id="drawerPhoto" aria-hidden="true"></span>
        <span class="avatar-edit-overlay" aria-hidden="true">수정</span>
      </button>
      <input id="avatarInput" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      <div>
        <p class="drawer-name" id="drawerName"></p>
        <p class="drawer-provider">일반 계정</p>
      </div>
      </div>

      <div class="drawer-menu">
        <button class="drawer-menu-row" id="profileEditButton" type="button">개인정보 수정</button>
        <button class="drawer-menu-row" id="myTitlesButton" type="button">나의 제목들</button>
        <button class="drawer-menu-row danger" id="logoutButton" type="button">로그아웃</button>
      </div>
    </div>

    <div class="drawer-view" id="myTitlesView" hidden>
      <div class="drawer-subhead">
        <button class="drawer-back" id="drawerBackButton" type="button">메뉴로</button>
        <h3>나의 제목들</h3>
      </div>
      <div class="my-title-list" id="myTitleList"></div>
    </div>
  </aside>

  <div class="auth-modal" id="authModal" hidden role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <div class="auth-card">
      <button class="modal-close" id="modalClose" type="button" aria-label="닫기"></button>
      <p class="modal-kicker" id="authKicker">계정</p>
      <h2 id="authTitle">로그인</h2>

      <div class="auth-switch" role="tablist" aria-label="계정 메뉴">
        <button class="auth-switch-button is-active" id="loginTabButton" type="button" data-auth-mode="login">로그인</button>
        <button class="auth-switch-button" id="signupTabButton" type="button" data-auth-mode="signup">회원가입</button>
      </div>

      <form class="auth-step auth-form is-active" id="loginForm">
        <label for="loginIdInput">아이디</label>
        <input id="loginIdInput" name="loginId" type="text" minlength="8" autocomplete="username" />

        <label for="loginPasswordInput">비밀번호</label>
        <input id="loginPasswordInput" name="password" type="password" autocomplete="current-password" />

        <p class="auth-message" id="loginMessage" aria-live="polite"></p>
        <button class="auth-button solid full" type="submit">로그인</button>
      </form>

      <form class="auth-step auth-form" id="signupForm">
        <label for="signupLoginIdInput">아이디</label>
        <input id="signupLoginIdInput" name="loginId" type="text" minlength="8" autocomplete="username" />

        <label for="signupUsernameInput">사용자 이름</label>
        <input id="signupUsernameInput" name="username" type="text" maxlength="24" autocomplete="nickname" />

        <label for="signupPasswordInput">비밀번호</label>
        <input id="signupPasswordInput" name="password" type="password" autocomplete="new-password" />

        <label for="signupPasswordConfirmInput">비밀번호 확인</label>
        <input id="signupPasswordConfirmInput" name="passwordConfirm" type="password" autocomplete="new-password" />

        <p class="auth-message" id="signupMessage" aria-live="polite"></p>
        <button class="auth-button solid full" type="submit">회원가입</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast" aria-live="polite"></div>

  <script defer src="main.js"></script>
</body>
</html>
